[build-system]
requires = ["setuptools==65.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blackjack-rl"
version = "0.1.0"
description = "Finite-shoe blackjack bankroll reinforcement learning research"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.3", "gymnasium==0.29.1", "torch==2.2.1",
  "stable-baselines3==2.3.2", "sb3-contrib==2.3.0",
  "tensorboard==2.17.1", "tqdm==4.65.0", "rich==13.3.5",
  "pydantic==1.10.12", "PyYAML==6.0.1", "pandas==2.1.4",
  "pyarrow==14.0.2", "plotly==5.9.0", "matplotlib==3.8.0",
]

[project.optional-dependencies]
dev = ["pytest==7.4.0", "hypothesis==6.112.1", "ruff==0.6.9"]

[project.scripts]
blackjack-rl = "blackjack_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

