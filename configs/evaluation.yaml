  soft_stand_total: 19
  soft_stand: {18: [2, 3, 4, 5, 6, 7, 8]}
  soft_double: {13: [5, 6], 14: [5, 6], 15: [4, 5, 6], 16: [4, 5, 6], 17: [3, 4, 5, 6], 18: [3, 4, 5, 6]}
  count_thresholds: [1, 2, 3, 4]
